name: Build and Release FetchIt

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup WiX Toolset
        run: |
          $wixPath = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
          if ($wixPath) {
            $wixBin = Join-Path $wixPath.FullName "bin"
            echo "WiX found at: $wixBin"
            echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Error "WiX Toolset not found"
            exit 1
          }
        shell: pwsh

      - name: Download JavaFX jmods
        run: |
           Invoke-WebRequest -Uri "https://download2.gluonhq.com/openjfx/21.0.12/openjfx-21.0.12_windows-x64_bin-jmods.zip" -OutFile "javafx-jmods.zip"
           Expand-Archive -Path "javafx-jmods.zip" -DestinationPath "javafx-jmods-temp" -Force
           $dir = Get-ChildItem "javafx-jmods-temp" -Directory | Select-Object -First 1
           Move-Item $dir.FullName "javafx-jmods-21"
           Remove-Item -Recurse -Force "javafx-jmods-temp", "javafx-jmods.zip"
           Get-ChildItem "javafx-jmods-21" | Select-Object -First 5
        shell: pwsh

      - name: Download bundle binaries
        run: |
          New-Item -ItemType Directory -Force -Path "bundle" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bundle/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/9.0.1/ffmpeg-9.0.1-essentials_build.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          $ffmpegBin = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeBin = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegBin.FullName "bundle/ffmpeg.exe"
          Copy-Item $ffprobeBin.FullName "bundle/ffprobe.exe"
          Remove-Item -Recurse -Force "ffmpeg-temp", "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno-temp" -Force
          Copy-Item "deno-temp/deno.exe" "bundle/deno.exe"
          Remove-Item -Recurse -Force "deno-temp", "deno.zip"
          Get-ChildItem "bundle" | Format-Table Name, Length
        shell: pwsh

      - name: Build with Maven
        run: mvn -B clean verify

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/installer/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}