name: Build and Release FetchIt

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup WiX Toolset
        run: |
          $wixPath = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
          if ($wixPath) {
            $wixBin = Join-Path $wixPath.FullName "bin"
            echo "WiX found at: $wixBin"
            echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Error "WiX Toolset not found"
            exit 1
          }
        shell: pwsh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MSI Installer with Gradle
        run: ./gradlew packageMsi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/compose/binaries/main/msi/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}