name: Build and Release FetchIt

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup WiX Toolset
        run: |
          $wixPath = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
          if ($wixPath) {
            $wixBin = Join-Path $wixPath.FullName "bin"
            echo "WiX found at: $wixBin"
            echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Error "WiX Toolset not found"
            exit 1
          }
        shell: pwsh

      - name: Download JavaFX jmods
        run: |
           Invoke-WebRequest -Uri "https://download2.gluonhq.com/openjfx/21.0.12/openjfx-21.0.12_windows-x64_bin-jmods.zip" -OutFile "javafx-jmods.zip"
           Expand-Archive -Path "javafx-jmods.zip" -DestinationPath "javafx-jmods-temp" -Force
           $dir = Get-ChildItem "javafx-jmods-temp" -Directory | Select-Object -First 1
           Move-Item $dir.FullName "javafx-jmods-21"
           Remove-Item -Recurse -Force "javafx-jmods-temp", "javafx-jmods.zip"
           Get-ChildItem "javafx-jmods-21" | Select-Object -First 5
        shell: pwsh

      - name: Build with Maven
        run: mvn -B clean verify

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/installer/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}