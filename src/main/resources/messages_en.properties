# --- Tooltips ---
tooltip.name=Arbitrary preset name. Used in the dropdown list.
tooltip.format=Download type:\n\u2022 audio \u2014 sound only (MP3, FLAC, etc.)\n\u2022 video \u2014 full video file
tooltip.audio_format=Audio format:\n\u2022 mp3 \u2014 universal\n\u2022 m4a \u2014 better quality at smaller size\n\u2022 flac \u2014 lossless, large size\n\u2022 opus \u2014 modern, efficient
tooltip.audio_quality=Audio quality (FFmpeg scale):\n\u2022 0 \u2014 best (max bitrate ~320 kbps)\n\u2022 5 \u2014 average (~160 kbps)\n\u2022 10 \u2014 worst (~65 kbps)
tooltip.video_quality=Max video quality:\n\u2022 best \u2014 best available\n\u2022 1080p, 720p, etc. \u2014 height restriction
tooltip.merge_format=Video container:\n\u2022 mp4 \u2014 universal, for most players\n\u2022 mkv \u2014 for high quality and subtitles\n\u2022 webm \u2014 open format
tooltip.embed_thumbnail=Embed thumbnail into file.\nFor MP3 \u2014 image in tags, for video \u2014 preview frame.
tooltip.add_metadata=Add metadata: title, artist, album, year.\nHighly recommended.
tooltip.embed_chapters=Embed chapters (video only).\nAllows switching by meaningful parts in player.
tooltip.write_subs=Write subtitles as a separate file (.srt / .vtt)\nnext to the video. Can be edited in Notepad.
tooltip.embed_subs=Embed subtitles inside the video file.\nPlayer can toggle them on/off.
tooltip.sub_langs=Subtitle languages comma-separated (ISO codes):\ne.g., en,ru \u2014 English and Russian.
tooltip.fragments=Concurrent fragments for downloading:\n\u2022 1 \u2014 slow but safe\n\u2022 4 \u2014 good balance\n\u2022 8+ \u2014 faster, but possible network errors.
tooltip.limit_rate=Download speed limit:\ne.g., 5M \u2014 5 MB/s.\nEmpty \u2014 no limit.
tooltip.retries=Number of retries on network failure.\n10 \u2014 default, 20+ \u2014 for unstable internet.
tooltip.sponsorblock=SponsorBlock categories to remove from video:\n\u2022 sponsor\n\u2022 selfpromo\n\u2022 intro\n\u2022 outro\nComma-separated, e.g.: sponsor,selfpromo
tooltip.keep_video=Keep original video file after extracting audio.\nAudio presets only. Takes twice the space.
tooltip.no_overwrites=Do not overwrite existing files in folder.\nRecommended to keep enabled.

