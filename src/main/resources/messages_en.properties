# --- Tooltips ---
tooltip.name=Arbitrary preset name. Used in the dropdown list.
tooltip.format=Download type: audio (sound only) or video (video file).
tooltip.audio_format=Audio format: mp3 (universal), m4a (better quality), flac (lossless), opus.
tooltip.audio_quality=Audio quality: 0 (best, ~320 kbps), 5 (average), 10 (worst).
tooltip.video_quality=Max video quality: best, 1080p, 720p, etc.
tooltip.merge_format=Container: mp4 (universal), mkv (high quality), webm.
tooltip.embed_thumbnail=Embed thumbnail (cover) into the file.
tooltip.add_metadata=Add title, artist, album, year. Recommended.
tooltip.embed_chapters=Embed chapters into video (if available).
tooltip.write_subs=Write subtitles as separate files (.srt).
tooltip.embed_subs=Embed subtitles inside the video file.
tooltip.sub_langs=Subtitle languages comma-separated (e.g., en,ru).
tooltip.fragments=Download N fragments concurrently. 1 - slow, 4 - fast, 8+ - ban risk.
tooltip.limit_rate=Limit download speed (e.g., 5M = 5 MB/s).
tooltip.retries=Number of retries on network failure.
tooltip.sponsorblock=Remove sponsor segments (sponsor, selfpromo, etc.).
tooltip.keep_video=Keep original video file after extracting audio.
tooltip.no_overwrites=Do not overwrite existing files.

